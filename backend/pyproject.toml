[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis-ui"
version = "0.1.0"
description = "Point-and-click statistics and publication-quality graphs, powered by R and Python"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pandas>=2.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "scikit-learn>=1.4",
  "lifelines>=0.28",
  "scikit-posthocs>=0.9",
  "openpyxl>=3.1",
  "pyreadstat>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
analysis-ui = "analysis_ui.cli:main"

[tool.setuptools.packages.find]
include = ["analysis_ui*"]

[tool.setuptools.package-data]
analysis_ui = ["shared/*.json", "sample_data/*", "r/**/*.R", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
